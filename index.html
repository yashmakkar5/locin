<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locin – Personal Performance Operating System</title>
  <meta name="description" content="Small actions. Massive results. Locin helps you set goals, build habits, track streaks, and measure your LOCIN Performance Index (LPI) 100% privately on your device.">
  
  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/landing.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/dashboard.css">

  <!-- React 18, ReactDOM, Babel, Lucide Icons, Canvas Confetti -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Modular Storage Architecture & Analytics Engine -->
  <script src="./js/storage/storageManager.js"></script>
  <script src="./js/storage/goalStorage.js"></script>
  <script src="./js/storage/taskStorage.js"></script>
  <script src="./js/storage/subtaskStorage.js"></script>
  <script src="./js/storage/streakStorage.js"></script>
  <script src="./js/storage/calendarStorage.js"></script>
  <script src="./js/storage/settingsStorage.js"></script>
  <script src="./js/storage/lpiCalculator.js"></script>

  <!-- React Application Scripts -->
  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useCallback } = React;

    // --- 1. Navigation Context ---
    const AuthContext = createContext();

    window.AuthProvider = function({ children }) {
      const [authView, setAuthView] = useState('landing');

      return (
        <AuthContext.Provider value={{ authView, setAuthView }}>
          {children}
        </AuthContext.Provider>
      );
    };

    window.useAuth = function() {
      return useContext(AuthContext);
    };

    // --- 2. Goal & Performance Context ---
    const GoalContext = createContext();

    window.GoalProvider = function({ children }) {
      const [goals, setGoals] = useState([]);
      const [streak, setStreak] = useState({ current_streak: 0, longest_streak: 0, last_checkin_date: null });
      const [isTodayCheckedIn, setIsTodayCheckedIn] = useState(false);
      const [calendarHistory, setCalendarHistory] = useState({});
      const [profile, setProfile] = useState({ name: 'Scholar Student' });
      const [settings, setSettings] = useState({ onboardingCompleted: false });
      const [lpiMetrics, setLpiMetrics] = useState({});
      const [feedbackBanner, setFeedbackBanner] = useState(null);
      const [errorBanner, setErrorBanner] = useState(null);

      // Cascade & Celebration Modals
      const [cascadeModalInfo, setCascadeModalInfo] = useState(null); // { type: 'TASK'|'GOAL', title, goalId, taskId }
      const [celebrationGoal, setCelebrationGoal] = useState(null);

      // Sync React state with storage
      const syncWithStorage = useCallback(() => {
        const currentGoals = window.goalStorage.getGoals();
        setGoals(currentGoals);
        setStreak(window.streakStorage.getStreak());
        setIsTodayCheckedIn(window.streakStorage.isTodayCheckedIn());
        setCalendarHistory(window.calendarStorage.getCalendarHistory());
        setProfile(window.settingsStorage.getProfile());

        const store = window.storageManager.getStore();
        setSettings(store.settings || {});

        // Recalculate LPI
        const analytics = window.lpiCalculator.calculate(store);
        setLpiMetrics(analytics);
      }, []);

      useEffect(() => {
        syncWithStorage();
      }, [syncWithStorage]);

      // Goal Controls
      const addGoal = (title, category, color) => {
        setErrorBanner(null);
        window.goalStorage.addGoal(title, category, color);
        syncWithStorage();
        setFeedbackBanner("🎯 Goal created successfully!");
        setTimeout(() => setFeedbackBanner(null), 3000);
      };

      const markGoalComplete = (goalId, triggerCelebration = true) => {
        setErrorBanner(null);
        const completedGoal = window.goalStorage.markGoalComplete(goalId);
        syncWithStorage();

        if (triggerCelebration && completedGoal) {
          if (window.confetti) {
            window.confetti({ particleCount: 140, spread: 90, origin: { y: 0.5 } });
          }
          setCelebrationGoal(completedGoal);
        }
      };

      const markGoalInProgress = (goalId) => {
        setErrorBanner(null);
        window.goalStorage.reopenGoal(goalId);
        syncWithStorage();
        setFeedbackBanner("Goal marked in progress.");
        setTimeout(() => setFeedbackBanner(null), 3000);
      };

      const deleteGoal = (goalId) => {
        setErrorBanner(null);
        window.goalStorage.deleteGoal(goalId);
        syncWithStorage();
        setFeedbackBanner("Goal deleted.");
        setTimeout(() => setFeedbackBanner(null), 3000);
      };

      // Task Controls
      const addTask = (goalId, title) => {
        setErrorBanner(null);
        window.taskStorage.addTask(goalId, title);
        syncWithStorage();
        setFeedbackBanner("📌 Task added.");
        setTimeout(() => setFeedbackBanner(null), 3000);
      };

      const markTaskComplete = (goalId, taskId) => {
        setErrorBanner(null);
        window.taskStorage.markTaskComplete(goalId, taskId);
        syncWithStorage();

        // Check if all tasks under goal are now completed
        const updatedGoals = window.goalStorage.getGoals();
        const targetGoal = updatedGoals.find(g => g.id === goalId);
        if (targetGoal && !targetGoal.completed && targetGoal.tasks.length > 0) {
          const allTasksDone = targetGoal.tasks.every(t => t.completed);
          if (allTasksDone) {
            setCascadeModalInfo({
              type: 'GOAL',
              title: targetGoal.title,
              goalId: targetGoal.id
            });
          }
        }
      };

      const markTaskInProgress = (goalId, taskId) => {
        setErrorBanner(null);
        window.taskStorage.markTaskInProgress(goalId, taskId);
        syncWithStorage();
      };

      const deleteTask = (goalId, taskId) => {
        setErrorBanner(null);
        window.taskStorage.deleteTask(goalId, taskId);
        syncWithStorage();
      };

      // Subtask Controls
      const addSubtask = (goalId, taskId, title) => {
        setErrorBanner(null);
        window.subtaskStorage.addSubtask(goalId, taskId, title);
        syncWithStorage();
      };

      const toggleSubtask = (goalId, taskId, subtaskId) => {
        setErrorBanner(null);
        const res = window.subtaskStorage.toggleSubtask(goalId, taskId, subtaskId);
        syncWithStorage();

        // Cascade Check: If all subtasks under task completed
        if (res.allSubtasksDone && res.task && !res.task.completed) {
          setCascadeModalInfo({
            type: 'TASK',
            title: res.task.title,
            goalId,
            taskId
          });
        }
      };

      const deleteSubtask = (goalId, taskId, subtaskId) => {
        setErrorBanner(null);
        window.subtaskStorage.deleteSubtask(goalId, taskId, subtaskId);
        syncWithStorage();
      };

      // Daily Check-in
      const triggerDailyCheckIn = () => {
        setErrorBanner(null);
        const res = window.streakStorage.processCheckIn();

        if (!res.success && res.error) {
          setErrorBanner(res.error);
          setTimeout(() => setErrorBanner(null), 4000);
          return;
        }

        if (!res.success && res.info) {
          setFeedbackBanner(res.info);
          setTimeout(() => setFeedbackBanner(null), 3500);
          return;
        }

        if (res.success) {
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }
          syncWithStorage();
          setFeedbackBanner(res.message);
          setTimeout(() => setFeedbackBanner(null), 3500);
        }
      };

      // Profile & Settings
      const updateUserProfile = (name) => {
        window.settingsStorage.updateProfile(name);
        syncWithStorage();
        setFeedbackBanner("Profile name updated!");
        setTimeout(() => setFeedbackBanner(null), 3000);
      };

      const completeOnboarding = () => {
        const store = window.storageManager.getStore();
        store.settings.onboardingCompleted = true;
        window.storageManager.saveStore(store);
        syncWithStorage();
      };

      const handleLoadDemoData = () => {
        window.settingsStorage.loadDemoData();
        syncWithStorage();
        setFeedbackBanner("✨ Demo goals loaded into storage!");
        setTimeout(() => setFeedbackBanner(null), 3500);
      };

      // Backup & Restore
      const exportBackupData = () => {
        window.settingsStorage.exportBackup();
        setFeedbackBanner("📥 JSON Backup downloaded successfully!");
        setTimeout(() => setFeedbackBanner(null), 3500);
      };

      const importBackupData = (fileContent) => {
        setErrorBanner(null);
        const res = window.settingsStorage.importBackup(fileContent);
        if (res.success) {
          syncWithStorage();
          setFeedbackBanner("✅ Backup imported successfully!");
          setTimeout(() => setFeedbackBanner(null), 3500);
          return true;
        } else {
          setErrorBanner("❌ Import Failed: " + res.error);
          return false;
        }
      };

      const resetAllData = () => {
        window.storageManager.clearStore();
        syncWithStorage();
        setFeedbackBanner("🗑️ All local data has been reset.");
        setTimeout(() => setFeedbackBanner(null), 3500);
      };

      return (
        <GoalContext.Provider value={{
          goals,
          streak,
          isTodayCheckedIn,
          calendarHistory,
          profile,
          settings,
          lpiMetrics,
          feedbackBanner,
          errorBanner,
          cascadeModalInfo,
          setCascadeModalInfo,
          celebrationGoal,
          setCelebrationGoal,
          addGoal,
          markGoalComplete,
          markGoalInProgress,
          deleteGoal,
          addTask,
          markTaskComplete,
          markTaskInProgress,
          deleteTask,
          addSubtask,
          toggleSubtask,
          deleteSubtask,
          triggerDailyCheckIn,
          updateUserProfile,
          completeOnboarding,
          handleLoadDemoData,
          exportBackupData,
          importBackupData,
          resetAllData
        }}>
          {children}
        </GoalContext.Provider>
      );
    };

    window.useGoals = function() {
      return useContext(GoalContext);
    };

    // --- 3. First Launch Onboarding Modal ---
    window.WelcomeModal = function() {
      const { settings, completeOnboarding } = window.useGoals();
      if (settings.onboardingCompleted) return null;

      return (
        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0, 0, 0, 0.8)', backdropFilter: 'blur(10px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '20px' }}>
          <div className="glass-card" style={{ maxWidth: '550px', width: '100%', padding: '36px', textAlign: 'center' }}>
            <div style={{ fontSize: '3rem', marginBottom: 12 }}>🛡️</div>
            <h2 style={{ fontSize: '1.8rem', marginBottom: 12 }}>Welcome to Locin</h2>
            <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem', lineHeight: 1.6, marginBottom: 24 }}>
              Locin is a <strong>100% Privacy-First Personal Performance OS</strong>. Track your LOCIN Performance Index (LPI), complete goals, and build streaks 100% locally.
            </p>

            <div style={{ textAlign: 'left', background: 'rgba(255, 255, 255, 0.03)', padding: 20, borderRadius: 'var(--radius-sm)', marginBottom: 24, display: 'flex', flexDirection: 'column', gap: 10, fontSize: '0.85rem' }}>
              <div>⚡ <strong>No Signup Required</strong></div>
              <div>📈 <strong>Live LPI Performance Gauge (0-100)</strong></div>
              <div>📥 <strong>Backup & Restore via JSON anytime</strong></div>
            </div>

            <button className="btn btn-primary" style={{ width: '100%', padding: '14px' }} onClick={completeOnboarding}>
              Launch Performance OS 🚀
            </button>
          </div>
        </div>
      );
    };

    // --- 4. Cascade & Celebration Modals ---
    window.CascadeModal = function() {
      const { cascadeModalInfo, setCascadeModalInfo, markTaskComplete, markGoalComplete } = window.useGoals();
      if (!cascadeModalInfo) return null;

      const isTask = cascadeModalInfo.type === 'TASK';

      const handleConfirm = () => {
        if (isTask) {
          markTaskComplete(cascadeModalInfo.goalId, cascadeModalInfo.taskId);
        } else {
          markGoalComplete(cascadeModalInfo.goalId);
        }
        setCascadeModalInfo(null);
      };

      return (
        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0, 0, 0, 0.75)', backdropFilter: 'blur(8px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '20px' }}>
          <div className="glass-card" style={{ maxWidth: '480px', width: '100%', padding: '32px', textAlign: 'center' }}>
            <div style={{ fontSize: '2.5rem', marginBottom: 12 }}>⚡</div>
            <h3 style={{ fontSize: '1.4rem', marginBottom: 12 }}>
              {isTask ? "All subtasks completed!" : "Everything is finished!"}
            </h3>
            <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem', marginBottom: 24 }}>
              {isTask 
                ? `Mark task "${cascadeModalInfo.title}" as completed?`
                : `Mark goal "${cascadeModalInfo.title}" as completed?`}
            </p>
            <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
              <button className="btn btn-secondary btn-sm" onClick={() => setCascadeModalInfo(null)}>Not Yet</button>
              <button className="btn btn-primary btn-sm" onClick={handleConfirm}>Yes, Mark Completed ✓</button>
            </div>
          </div>
        </div>
      );
    };

    window.CelebrationModal = function() {
      const { celebrationGoal, setCelebrationGoal } = window.useGoals();
      if (!celebrationGoal) return null;

      let taskCount = (celebrationGoal.tasks || []).length;
      let subtaskCount = 0;
      (celebrationGoal.tasks || []).forEach(t => subtaskCount += (t.subtasks || []).length);

      const completedDate = celebrationGoal.completedAt 
        ? new Date(celebrationGoal.completedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        : new Date().toLocaleDateString();

      return (
        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0, 0, 0, 0.85)', backdropFilter: 'blur(10px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '20px' }}>
          <div className="glass-card" style={{ maxWidth: '500px', width: '100%', padding: '36px', textAlign: 'center', borderColor: '#f59e0b', boxShadow: '0 0 40px rgba(245, 158, 11, 0.3)' }}>
            <div style={{ fontSize: '3.5rem', marginBottom: 8 }}>🏆</div>
            <span className="badge badge-flame" style={{ marginBottom: 12 }}>Milestone Achieved</span>
            <h2 style={{ fontSize: '2rem', marginBottom: 8 }} className="gradient-text">Goal Completed!</h2>
            <h3 style={{ fontSize: '1.25rem', color: '#fff', marginBottom: 20 }}>"{celebrationGoal.title}"</h3>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, background: 'rgba(255, 255, 255, 0.03)', padding: 16, borderRadius: 'var(--radius-sm)', marginBottom: 24, textAlign: 'left', fontSize: '0.85rem' }}>
              <div><span style={{ color: 'var(--text-muted)' }}>Completion Date:</span> <br /><strong>{completedDate}</strong></div>
              <div><span style={{ color: 'var(--text-muted)' }}>Category:</span> <br /><strong>{celebrationGoal.category}</strong></div>
              <div><span style={{ color: 'var(--text-muted)' }}>Tasks Finished:</span> <br /><strong>{taskCount} Tasks</strong></div>
              <div><span style={{ color: 'var(--text-muted)' }}>Subtasks Finished:</span> <br /><strong>{subtaskCount} Subtasks</strong></div>
            </div>

            <button className="btn btn-primary" style={{ width: '100%', padding: '12px' }} onClick={() => setCelebrationGoal(null)}>
              Continue Executing 👑
            </button>
          </div>
        </div>
      );
    };

    // --- 5. Reusable UI Components ---
    window.Header = function({ onNavigateAuth }) {
      return (
        <header className="landing-header">
          <a href="#" className="logo-container">
            <div className="logo-icon"><i data-lucide="zap" style={{ color: '#fff' }}></i></div>
            <span>locin</span>
          </a>
          <nav className="nav-links">
            <a href="#features" className="nav-link">Features</a>
            <a href="#privacy" className="nav-link">Privacy</a>
            <a href="#compounding" className="nav-link">Why It Works</a>
            <button className="btn btn-primary btn-sm" onClick={() => onNavigateAuth('dashboard')}>Launch App 🚀</button>
          </nav>
        </header>
      );
    };

    window.Modal = function({ isOpen, onClose, title, children }) {
      if (!isOpen) return null;
      return (
        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0, 0, 0, 0.75)', backdropFilter: 'blur(8px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '20px' }}>
          <div className="glass-card" style={{ maxWidth: '500px', width: '100%', padding: '28px', position: 'relative' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '20px', borderBottom: '1px solid var(--border-color)', paddingBottom: '12px' }}>
              <h3 style={{ fontSize: '1.25rem' }}>{title}</h3>
              <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', fontSize: '1.2rem' }}>✕</button>
            </div>
            <div>{children}</div>
          </div>
        </div>
      );
    };

    window.HeroSection = function({ onNavigateAuth }) {
      return (
        <section className="hero-section">
          <div className="hero-pill">
            <span className="badge badge-primary"><i data-lucide="shield-check" style={{ width: 14, height: 14 }}></i> Personal Performance OS • No Account Needed</span>
          </div>
          <h1 className="hero-title">Small actions. <br /><span className="gradient-text">Massive results.</span></h1>
          <p className="hero-subtitle">Transform your ambitions into daily compounding victories. Set goals, track your LOCIN Performance Index (LPI), and grow your fire streak 100% privately.</p>
          <div className="hero-cta-group">
            <button className="btn btn-primary" onClick={() => onNavigateAuth('dashboard')}><span>Launch Application</span><i data-lucide="arrow-right" style={{ width: 18, height: 18 }}></i></button>
          </div>
          <div className="hero-visual">
            <div className="glass-card floating-card animate-float" style={{ animationDelay: '0s' }}>
              <div className="floating-card-icon">🧠</div>
              <div><div style={{ fontWeight: 700, fontSize: '0.95rem' }}>Learn AI & ML</div><div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Python Basics • Variables</div><div className="badge badge-success" style={{ marginTop: 6 }}>92% Completed</div></div>
            </div>
            <div className="glass-card floating-card animate-float" style={{ animationDelay: '1.5s', borderColor: 'rgba(245, 158, 11, 0.4)' }}>
              <div className="floating-card-icon">🔥</div>
              <div><div style={{ fontWeight: 700, fontSize: '0.95rem' }}>Active Streak</div><div style={{ fontSize: '1.2rem', fontWeight: 800 }} className="gradient-flame">7 Days Unstoppable</div><div style={{ fontSize: '0.75rem', color: 'var(--text-subtle)' }}>Duolingo-inspired Momentum</div></div>
            </div>
            <div className="glass-card floating-card animate-float" style={{ animationDelay: '3s' }}>
              <div className="floating-card-icon">📅</div>
              <div><div style={{ fontWeight: 700, fontSize: '0.95rem' }}>Calendar Progress</div><div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>28 Days Checked In</div><div className="badge badge-primary" style={{ marginTop: 6 }}>Perfect Monthly Consistency</div></div>
            </div>
          </div>
        </section>
      );
    };

    window.FeaturesSection = function() {
      const features = [
        { icon: 'shield', title: '100% Privacy First', desc: 'No accounts, no cloud databases. Your data never leaves your device.' },
        { icon: 'target', title: '3-Tier Goal Management', desc: 'Organize Goals into Tasks, and break Tasks into Subtasks.' },
        { icon: 'trending-up', title: 'LPI Performance Gauge', desc: 'LOCIN Performance Index (0-100) analytics with dynamic feedback.' },
        { icon: 'flame', title: 'Duolingo Fire Streak', desc: 'Build unstoppable momentum with visual 🔥 streak tracking.' },
        { icon: 'calendar', title: 'Calendar Heatmap', desc: 'Visualize your monthly activity with crisp color indicators.' },
        { icon: 'award', title: 'Goal Completion History', desc: 'Archive completed goals, view milestone stats, or reopen anytime.' },
        { icon: 'download', title: 'JSON Backup & Restore', desc: 'Export all data to a JSON file and restore anytime.' }
      ];
      return (
        <section id="features" className="section-container">
          <div className="section-header">
            <span className="badge badge-primary" style={{ marginBottom: 12 }}>Local & Private</span>
            <h2 className="section-title">Everything you need to master your goals</h2>
            <p className="section-description">Built with precision to help student developers maintain consistency offline.</p>
          </div>
          <div className="features-grid">
            {features.map((f, i) => (
              <div key={i} className="glass-card feature-card">
                <div className="feature-icon-wrapper"><i data-lucide={f.icon} style={{ width: 28, height: 28 }}></i></div>
                <h3>{f.title}</h3>
                <p>{f.desc}</p>
              </div>
            ))}
          </div>
        </section>
      );
    };

    window.MotivationSection = function() {
      const quotes = [
        { quote: "I fear not the man who has practiced 10,000 kicks once, but I fear the man who has practiced one kick 10,000 times.", author: "Bruce Lee", role: "Martial Artist & Philosopher" },
        { quote: "You do not rise to the level of your goals. You fall to the level of your systems.", author: "James Clear", role: "Author of Atomic Habits" },
        { quote: "Discipline is doing what you hate to do, but doing it like you love it.", author: "Mike Tyson", role: "Heavyweight Champion" },
        { quote: "I hated every minute of training, but I said, 'Don't quit. Suffer now and live as a champion.'", author: "Muhammad Ali", role: "Global Icon & Champion" },
        { quote: "The only way to do great work is to love what you do.", author: "Steve Jobs", role: "Co-Founder of Apple" },
        { quote: "The resistance that you fight physically and in life builds a strong character.", author: "Arnold Schwarzenegger", role: "Bodybuilder & Entrepreneur" }
      ];
      return (
        <section id="motivation" className="section-container" style={{ background: 'rgba(255, 255, 255, 0.01)' }}>
          <div className="section-header">
            <span className="badge badge-flame" style={{ marginBottom: 12 }}>Mindset matters</span>
            <h2 className="section-title">Words from the World's Best</h2>
            <p className="section-description">Consistency is the bridge between goals and accomplishment.</p>
          </div>
          <div className="quotes-grid">
            {quotes.map((q, i) => (
              <div key={i} className="glass-card quote-card">
                <div className="quote-icon">“</div>
                <p className="quote-text">{q.quote}</p>
                <div>
                  <div className="quote-author">{q.author}</div>
                  <div className="quote-role">{q.role}</div>
                </div>
              </div>
            ))}
          </div>
        </section>
      );
    };

    window.CompoundingSection = function() {
      const [dailyPct, setDailyPct] = useState(1);
      const growthFactor = Math.pow(1 + dailyPct / 100, 365).toFixed(1);
      const declineFactor = Math.pow(1 - dailyPct / 100, 365).toFixed(2);

      return (
        <section id="compounding" className="section-container">
          <div className="section-header">
            <span className="badge badge-success" style={{ marginBottom: 12 }}>The Math of Success</span>
            <h2 className="section-title">Why Small Habits Compound</h2>
            <p className="section-description">Improving just {dailyPct}% every day yields exponential results by year end.</p>
          </div>
          <div className="compounding-wrapper">
            <div className="glass-card compounding-card">

    window.GoalManager = function() {
      const { goals, addGoal, markGoalComplete, markGoalInProgress, deleteGoal, addTask, markTaskComplete, markTaskInProgress, deleteTask, addSubtask, toggleSubtask, deleteSubtask } = window.useGoals();
      const [viewMode, setViewMode] = useState('active'); // 'active' | 'completed'
      const [isGoalModalOpen, setIsGoalModalOpen] = useState(false);
      const [goalTitle, setGoalTitle] = useState('');
      const [goalCategory, setGoalCategory] = useState('Technology');
      const [taskModalGoalId, setTaskModalGoalId] = useState(null);
      const [taskTitle, setTaskTitle] = useState('');
      const [subtaskModalInfo, setSubtaskModalInfo] = useState(null);
      const [subtaskTitle, setSubtaskTitle] = useState('');

      const activeGoals = goals.filter(g => !g.completed);
      const completedGoals = goals.filter(g => g.completed);
      const displayedGoals = viewMode === 'active' ? activeGoals : completedGoals;

      const handleCreateGoal = (e) => {
        e.preventDefault();
        if (!goalTitle.trim()) return;
        addGoal(goalTitle, goalCategory);
        setGoalTitle('');
        setIsGoalModalOpen(false);
      };

      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!taskTitle.trim() || !taskModalGoalId) return;
        addTask(taskModalGoalId, taskTitle);
        setTaskTitle('');
        setTaskModalGoalId(null);
      };

      const handleCreateSubtask = (e) => {
        e.preventDefault();
        if (!subtaskTitle.trim() || !subtaskModalInfo) return;
        addSubtask(subtaskModalInfo.goalId, subtaskModalInfo.taskId, subtaskTitle);
        setSubtaskTitle('');
        setSubtaskModalInfo(null);
      };

      return (
        <div>
          <div className="goals-header">
            <div>
              <h1 style={{ fontSize: '1.8rem' }}>Goal Management</h1>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem' }}>Structure your ambitions: 🎯 Goal → 📌 Task → 🔹 Subtasks</p>
            </div>
            <div style={{ display: 'flex', gap: 12 }}>
              <div style={{ display: 'flex', background: 'rgba(255, 255, 255, 0.05)', padding: 4, borderRadius: 'var(--radius-sm)' }}>
                <button className={`btn btn-sm ${viewMode === 'active' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setViewMode('active')}>Active ({activeGoals.length})</button>
                <button className={`btn btn-sm ${viewMode === 'completed' ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setViewMode('completed')}>Completed ({completedGoals.length})</button>
              </div>
              <button className="btn btn-primary" onClick={() => setIsGoalModalOpen(true)}><i data-lucide="plus" style={{ width: 18, height: 18 }}></i><span>Create New Goal</span></button>
            </div>
          </div>

          {displayedGoals.length === 0 ? (
            <div className="glass-card" style={{ padding: 50, textAlign: 'center', color: 'var(--text-muted)' }}>
              <div style={{ fontSize: '3rem', marginBottom: 12 }}>{viewMode === 'active' ? '🎯' : '🏆'}</div>
              <h3 style={{ fontSize: '1.3rem', color: 'var(--text-main)', marginBottom: 8 }}>
                {viewMode === 'active' ? 'No active goals' : 'No completed goals yet'}
              </h3>
              <p style={{ fontSize: '0.95rem', marginBottom: 20 }}>
                {viewMode === 'active' ? 'Click "Create New Goal" to start tracking your ambitions!' : 'Complete your active goals to populate milestone history here.'}
              </p>
              {viewMode === 'active' && <button className="btn btn-primary btn-sm" onClick={() => setIsGoalModalOpen(true)}>+ Create Goal</button>}
            </div>
          ) : (
            displayedGoals.map(goal => {
              let subtaskCount = 0;
              let doneSubtasks = 0;
              (goal.tasks || []).forEach(t => {
                (t.subtasks || []).forEach(st => {
                  subtaskCount++;
                  if (st.completed) doneSubtasks++;
                });
              });
              const goalPct = subtaskCount > 0 ? Math.round((doneSubtasks / subtaskCount) * 100) : (goal.completed ? 100 : 0);

              return (
                <div key={goal.id} className="glass-card goal-card" style={{ opacity: goal.completed ? 0.9 : 1, borderColor: goal.completed ? '#10b981' : undefined }}>
                  <div className="goal-top">
                    <div className="goal-title-group">
                      <span className="badge badge-primary">{goal.category}</span>
                      {goal.completed && <span className="badge badge-success">✓ Completed Goal</span>}
                      <h2 style={{ fontSize: '1.4rem', textDecoration: goal.completed ? 'line-through' : 'none' }}>🎯 {goal.title}</h2>
                    </div>

                    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                      {!goal.completed ? (
                        <>
                          <button className="btn btn-secondary btn-sm" onClick={() => markGoalComplete(goal.id)}>✓ Mark Complete</button>
                          <button className="btn btn-secondary btn-sm" onClick={() => setTaskModalGoalId(goal.id)}>+ Task</button>
                        </>
                      ) : (
                        <button className="btn btn-secondary btn-sm" onClick={() => markGoalInProgress(goal.id)}>↺ Reopen Goal</button>
                      )}
                      <button className="btn btn-danger btn-sm" onClick={() => deleteGoal(goal.id)}>🗑️</button>
                    </div>
                  </div>

                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.85rem', color: 'var(--text-muted)' }}>
                    <span>Goal Completion</span>
                    <span>{goalPct}%</span>
                  </div>
                  <div className="progress-bar-bg"><div className="progress-bar-fill" style={{ width: `${goalPct}%`, background: goal.completed ? '#10b981' : undefined }}></div></div>

                  <div className="task-tree">
                    {(goal.tasks || []).length === 0 ? <div style={{ fontSize: '0.85rem', color: 'var(--text-subtle)', fontStyle: 'italic' }}>No tasks added yet.</div> : (
                      goal.tasks.map(task => (
                        <div key={task.id} className="task-item" style={{ opacity: task.completed ? 0.8 : 1 }}>
                          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                            <div style={{ fontWeight: 600, fontSize: '1.05rem', textDecoration: task.completed ? 'line-through' : 'none' }}>📌 {task.title}</div>
                            <div style={{ display: 'flex', gap: 6 }}>
                              {!task.completed ? (
                                <button className="btn btn-secondary btn-sm" style={{ padding: '4px 8px', fontSize: '0.75rem' }} onClick={() => markTaskComplete(goal.id, task.id)}>✓ Complete Task</button>
                              ) : (
                                <button className="btn btn-secondary btn-sm" style={{ padding: '4px 8px', fontSize: '0.75rem' }} onClick={() => markTaskInProgress(goal.id, task.id)}>↺ Reopen Task</button>
                              )}
                              {!goal.completed && <button className="btn btn-secondary btn-sm" style={{ padding: '4px 8px', fontSize: '0.75rem' }} onClick={() => setSubtaskModalInfo({ goalId: goal.id, taskId: task.id })}>+ Subtask</button>}
                              <button className="btn btn-danger btn-sm" style={{ padding: '4px 8px', fontSize: '0.75rem' }} onClick={() => deleteTask(goal.id, task.id)}>✕</button>
                            </div>
                          </div>

                          <div className="subtask-tree">
                            {(task.subtasks || []).length === 0 ? <div style={{ fontSize: '0.8rem', color: 'var(--text-subtle)' }}>No subtasks.</div> : (
                              task.subtasks.map(subtask => (
                                <div key={subtask.id} className="subtask-item">
                                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                                    <div className={`custom-checkbox ${subtask.completed ? 'checked' : ''}`} onClick={() => toggleSubtask(goal.id, task.id, subtask.id)}>{subtask.completed && '✓'}</div>
                                    <span style={{ textDecoration: subtask.completed ? 'line-through' : 'none', color: subtask.completed ? 'var(--text-subtle)' : 'var(--text-main)' }}>🔹 {subtask.title}</span>
                                  </div>
                                  <button style={{ background: 'none', border: 'none', color: 'var(--text-subtle)', cursor: 'pointer', fontSize: '0.8rem' }} onClick={() => deleteSubtask(goal.id, task.id, subtask.id)}>✕</button>
                                </div>
                              ))
                            )}
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>

            <form onSubmit={handleCreateTask}>

            <form onSubmit={handleCreateSubtask}>
              <div className="form-group">
                <label>Subtask Title</label>
                <input type="text" className="form-input" placeholder="e.g. Circular LPI Score Gauge" value={subtaskTitle} onChange={(e) => setSubtaskTitle(e.target.value)} required />

              <button type="submit" className="btn btn-primary" style={{ width: '100%', marginTop: 12 }}>Save Subtask</button>
            </form>
          </window.Modal>
        </div>
      );

    window.DailyCheckIn = function() {
      const { goals, streak, isTodayCheckedIn, toggleSubtask, triggerDailyCheckIn, feedbackBanner, errorBanner } = window.useGoals();

      const todaySubtasks = [];
      goals.forEach(goal => {
        (goal.tasks || []).forEach(task => {
          (task.subtasks || []).forEach(subtask => {
            todaySubtasks.push({ goalId: goal.id, goalTitle: goal.title, taskId: task.id, taskTitle: task.title, subtask });
          });
        });
      });

      const completedCount = todaySubtasks.filter(item => item.subtask.completed).length;
      const allTasksCompleted = todaySubtasks.length > 0 && completedCount === todaySubtasks.length;

      let buttonState = 'DISABLED';
      let messageNotice = '';

      if (isTodayCheckedIn) {
        buttonState = 'CHECKED_IN';
        messageNotice = "You've already checked in today.";
      } else if (todaySubtasks.length === 0) {
        buttonState = 'ZERO_TASKS';
        messageNotice = 'No tasks scheduled for today.';
      } else if (!allTasksCompleted) {
        buttonState = 'INCOMPLETE';
        messageNotice = 'Finish all required tasks before checking in.';
      } else {
        buttonState = 'READY';
        messageNotice = 'All required tasks finished! Press Complete Today to claim your streak.';
      }

      return (
        <div>
          <div className="top-bar">
            <div>
              <h1 style={{ fontSize: '1.8rem' }}>Daily Check-in</h1>

    window.CalendarView = function() {
      const { streak, calendarHistory } = window.useGoals();
      const [currentDate, setCurrentDate] = useState(new Date());

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = new Date();

      const cells = [];
      for (let i = 0; i < firstDay; i++) cells.push({ empty: true });
      for (let day = 1; day <= daysInMonth; day++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isCompleted = !!calendarHistory[dStr];
        const isToday = (day === today.getDate() && month === today.getMonth() && year === today.getFullYear());
        const isPastMissed = !isCompleted && !isToday && new Date(dStr) < today;
        cells.push({ day, dateStr: dStr, isCompleted, isToday, isPastMissed });
      }

      return (
        <div>
          <div className="top-bar">
            <div>
              <h1 style={{ fontSize: '1.8rem' }}>Calendar Progress Heatmap</h1>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem' }}>Visual monthly activity log marked upon successful daily check-in.</p>
            </div>
            <div className="badge badge-flame" style={{ padding: '8px 16px', fontSize: '0.85rem' }}>🔥 {streak.current_streak || 0} Days Active Streak</div>
          </div>
          <div className="glass-card" style={{ padding: 32 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                <h2 style={{ fontSize: '1.4rem' }}>{monthNames[month]} {year}</h2>
                <div style={{ display: 'flex', gap: 6 }}>
                  <button className="btn btn-secondary btn-sm" onClick={() => setCurrentDate(new Date(year, month - 1, 1))}>← Prev</button>
                  <button className="btn btn-secondary btn-sm" onClick={() => setCurrentDate(new Date(year, month + 1, 1))}>Next →</button>
                </div>
              </div>
              <div style={{ display: 'flex', gap: 16, fontSize: '0.85rem', color: 'var(--text-muted)' }}>
                <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 12, height: 12, borderRadius: 3, background: 'rgba(245, 158, 11, 0.6)' }}></span> Checked In</span>
                <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 12, height: 12, borderRadius: 3, background: 'rgba(239, 68, 68, 0.25)', border: '1px solid rgba(239, 68, 68, 0.4)' }}></span> Missed</span>
                <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 12, height: 12, borderRadius: 3, border: '2px solid var(--primary)' }}></span> Today</span>
              </div>
            </div>

            <div className="calendar-grid">
              {daysOfWeek.map((d, i) => <div key={i} className="calendar-day-header">{d}</div>)}
              {cells.map((cell, idx) => {
                if (cell.empty) return <div key={idx} className="calendar-day-cell empty"></div>;
                return (
                  <div key={idx} className={`calendar-day-cell ${cell.isCompleted ? 'flame' : ''}`} style={{ border: cell.isToday ? '2px solid var(--primary)' : undefined, background: cell.isPastMissed ? 'rgba(239, 68, 68, 0.08)' : undefined, borderColor: cell.isPastMissed ? 'rgba(239, 68, 68, 0.2)' : undefined }}>
                    <span>{cell.day}</span>
                    {cell.isCompleted && <span style={{ fontSize: '0.75rem', marginTop: 2 }}>🔥</span>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

            <h2 style={{ fontSize: '1.4rem', marginBottom: 12, color: '#6ee7b7' }}>🛡️ Privacy First Philosophy</h2>
            <blockquote style={{ fontSize: '1.05rem', lineHeight: 1.6, color: 'var(--text-main)', fontStyle: 'italic', borderLeft: '3px solid #10b981', paddingLeft: 16, margin: '16px 0' }}>
              "Your productivity data stays entirely on your device. LOCIN does not require an account and does not upload your information to any server. Your goals, tasks, streaks, and statistics remain private. Future versions may offer optional cloud sync for users who want access across multiple devices."
            </blockquote>
          </div>

          <window.Modal isOpen={showResetConfirm} onClose={() => setShowResetConfirm(false)} title="Confirm Reset All Local Data">
            <p style={{ color: 'var(--text-muted)', marginBottom: 20 }}>
              Are you sure? This will <strong>permanently delete all locally stored goals, tasks, fire streaks, and calendar history</strong> on this browser.
            </p>
            <div style={{ display: 'flex', gap: 12, justifyContent: 'flex-end' }}>
              <button className="btn btn-secondary btn-sm" onClick={() => setShowResetConfirm(false)}>Cancel</button>
              <button className="btn btn-danger btn-sm" onClick={() => { resetAllData(); setShowResetConfirm(false); }}>
                Yes, Reset All Data
              </button>
            </div>
          </window.Modal>
        </div>
      );
    };

    // --- 9. Main App Layout & View Router ---
    function AppContent() {
      const { authView, setAuthView } = window.useAuth();
      const [activeTab, setActiveTab] = useState('home');

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [authView, activeTab]);

      if (authView === 'landing') {
        return (
          <div className="app-container">
            <window.Header onNavigateAuth={(mode) => setAuthView(mode)} />
            <window.HeroSection onNavigateAuth={(mode) => setAuthView(mode)} />
            <window.FeaturesSection />
            <window.MotivationSection />
            <window.CompoundingSection />
            <window.FinalCtaSection onNavigateAuth={(mode) => setAuthView(mode)} />
          </div>
        );
      }

      return (
        <div className="dashboard-layout">
          <window.Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />
          <window.WelcomeModal />
          <window.CascadeModal />
          <window.CelebrationModal />
          <main className="dashboard-main">
            {activeTab === 'home' && <window.DashboardHome setActiveTab={setActiveTab} />}
            {activeTab === 'goals' && <window.GoalManager />}
            {activeTab === 'checkin' && <window.DailyCheckIn />}
            {activeTab === 'calendar' && <window.CalendarView />}
            {activeTab === 'stats' && <window.StatsView />}
            {activeTab === 'profile' && <window.ProfileView />}
            {activeTab === 'settings' && <window.SettingsView />}
          </main>
        </div>
      );
    }

    function App() {
      return (
        <window.AuthProvider>
          <window.GoalProvider>
            <AppContent />
          </window.GoalProvider>
        </window.AuthProvider>
      );
    }

    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    }
  </script>
</body>
</html>
