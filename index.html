<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locin – Privacy-First Goal Tracker & Habit Building Platform</title>
  <meta name="description" content="Small actions. Massive results. Locin helps you set goals, build habits, track streaks, and achieve compound success 100% privately on your device.">
  
  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/landing.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/dashboard.css">

  <!-- React 18, ReactDOM, Babel, Lucide Icons, Canvas Confetti -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Local Storage Persistence Engine -->
  <script src="./js/services/storageService.js"></script>

  <!-- React Application Scripts -->
  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useCallback } = React;

    // --- 1. Navigation / View Router Context ---
    const AuthContext = createContext();

    window.AuthProvider = function({ children }) {
      const [authView, setAuthView] = useState('landing'); // 'landing' | 'dashboard'

      return (
        <AuthContext.Provider value={{ authView, setAuthView }}>
          {children}
        </AuthContext.Provider>
      );
    };

    window.useAuth = function() {
      return useContext(AuthContext);
    };

    // --- 2. Goal & Storage Reactive Context ---
    const GoalContext = createContext();

    window.GoalProvider = function({ children }) {
      const [appData, setAppData] = useState(() => window.storageService.loadData());
      const [feedbackBanner, setFeedbackBanner] = useState(null);
      const [errorBanner, setErrorBanner] = useState(null);

      // Save helper
      const updateData = (updater) => {
        setAppData(prev => {
          const nextData = typeof updater === 'function' ? updater(prev) : { ...prev, ...updater };
          window.storageService.saveData(nextData);
          return nextData;
        });
      };

      // 3-Tier Hierarchy CRUD
      const addGoal = (title, category = 'General', color = '#6366f1') => {
        const newGoal = {
          id: 'g-' + Date.now(),
          title,
          category,
          color,
          created_at: new Date().toISOString(),
          tasks: []
        };
        updateData(prev => ({ ...prev, goals: [newGoal, ...prev.goals] }));
        setFeedbackBanner("🎯 Goal created successfully!");
        setTimeout(() => setFeedbackBanner(null), 3000);
      };

      const deleteGoal = (goalId) => {
        updateData(prev => ({ ...prev, goals: prev.goals.filter(g => g.id !== goalId) }));
        setFeedbackBanner("Goal deleted.");
        setTimeout(() => setFeedbackBanner(null), 3000);
      };

      const addTask = (goalId, taskTitle) => {
        const newTask = {
          id: 't-' + Date.now(),
          title: taskTitle,
          completed: false,
          subtasks: []
        };
        updateData(prev => ({
          ...prev,
          goals: prev.goals.map(g => (g.id === goalId ? { ...g, tasks: [...g.tasks, newTask] } : g))
        }));
        setFeedbackBanner("📌 Task added.");
        setTimeout(() => setFeedbackBanner(null), 3000);
      };

      const deleteTask = (goalId, taskId) => {
        updateData(prev => ({
          ...prev,
          goals: prev.goals.map(g => (g.id === goalId ? { ...g, tasks: g.tasks.filter(t => t.id !== taskId) } : g))
        }));
      };

      const addSubtask = (goalId, taskId, subtaskTitle) => {
        const newSubtask = {
          id: 'st-' + Date.now(),
          title: subtaskTitle,
          completed: false
        };
        updateData(prev => ({
          ...prev,
          goals: prev.goals.map(g => {
            if (g.id === goalId) {
              return {
                ...g,
                tasks: g.tasks.map(t => (t.id === taskId ? { ...t, subtasks: [...t.subtasks, newSubtask] } : t))
              };
            }
            return g;
          })
        }));
      };

      const toggleSubtask = (goalId, taskId, subtaskId) => {
        updateData(prev => ({
          ...prev,
          goals: prev.goals.map(g => {
            if (g.id === goalId) {
              return {
                ...g,
                tasks: g.tasks.map(t => {
                  if (t.id === taskId) {
                    const newSubtasks = t.subtasks.map(st => (st.id === subtaskId ? { ...st, completed: !st.completed } : st));
                    const allDone = newSubtasks.length > 0 && newSubtasks.every(st => st.completed);
                    return { ...t, completed: allDone, subtasks: newSubtasks };
                  }
                  return t;
                })
              };
            }
            return g;
          })
        }));
      };

      const deleteSubtask = (goalId, taskId, subtaskId) => {
        updateData(prev => ({
          ...prev,
          goals: prev.goals.map(g => {
            if (g.id === goalId) {
              return {
                ...g,
                tasks: g.tasks.map(t => (t.id === taskId ? { ...t, subtasks: t.subtasks.filter(st => st.id !== subtaskId) } : t))
              };
            }
            return g;
          })
        }));
      };

      // Daily Check-in & Fire Streak Date Math
      const triggerDailyCheckIn = () => {
        const todayStr = new Date().toISOString().split('T')[0];
        const lastDateStr = appData.streak.last_checkin_date;

        if (lastDateStr === todayStr) {
          setFeedbackBanner("⚡ You have already completed today's check-in! 🔥");
          setTimeout(() => setFeedbackBanner(null), 3500);
          return;
        }

        let newCurrent = 1;
        if (lastDateStr) {
          const todayDate = new Date(todayStr);
          const lastDate = new Date(lastDateStr);
          const diffDays = Math.ceil(Math.abs(todayDate - lastDate) / (1000 * 60 * 60 * 24));

          if (diffDays === 1) {
            newCurrent = (appData.streak.current_streak || 0) + 1;
          } else {
            newCurrent = 1; // Missed day resets streak
          }
        }

        const newLongest = Math.max(newCurrent, appData.streak.longest_streak || 0);

        if (window.confetti) {
          window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        }

        updateData(prev => ({
          ...prev,
          streak: {
            current_streak: newCurrent,
            longest_streak: newLongest,
            last_checkin_date: todayStr
          },
          calendarHistory: {
            ...prev.calendarHistory,
            [todayStr]: true
          }
        }));

        setFeedbackBanner("🔥 Daily Check-in Recorded! Streak: " + newCurrent + " Days!");
        setTimeout(() => setFeedbackBanner(null), 3500);
      };

      // Profile & Settings
      const updateUserProfile = (name) => {
        updateData(prev => ({
          ...prev,
          profile: { ...prev.profile, name }
        }));
        setFeedbackBanner("Profile name updated!");
        setTimeout(() => setFeedbackBanner(null), 3000);
      };

      const completeOnboarding = () => {
        updateData(prev => ({
          ...prev,
          settings: { ...prev.settings, onboardingCompleted: true }
        }));
      };

      // Backup & Restore
      const exportBackupData = () => {
        window.storageService.exportBackup();
        setFeedbackBanner("📥 JSON Backup downloaded successfully!");
        setTimeout(() => setFeedbackBanner(null), 3500);
      };

      const importBackupData = (fileContent) => {
        setErrorBanner(null);
        const res = window.storageService.importBackup(fileContent);
        if (res.success) {
          setAppData(res.data);
          setFeedbackBanner("✅ Backup imported successfully! All data restored.");
          setTimeout(() => setFeedbackBanner(null), 3500);
          return true;
        } else {
          setErrorBanner("❌ Import Failed: " + res.error);
          return false;
        }
      };

      const resetAllData = () => {
        const cleanData = window.storageService.resetData();
        setAppData(cleanData);
        setFeedbackBanner("🗑️ All local data has been reset to default.");
        setTimeout(() => setFeedbackBanner(null), 3500);
      };

      // Aggregate Stats Calculation
      const getStats = () => {
        const goalsList = appData.goals || [];
        let totalGoals = goalsList.length;
        let totalTasks = 0;
        let completedTasks = 0;
        let totalSubtasks = 0;
        let completedSubtasks = 0;

        goalsList.forEach(g => {
          (g.tasks || []).forEach(t => {
            totalTasks++;
            if (t.completed) completedTasks++;
            (t.subtasks || []).forEach(st => {
              totalSubtasks++;
              if (st.completed) completedSubtasks++;
            });
          });
        });

        const completionPercentage = totalSubtasks > 0 ? Math.round((completedSubtasks / totalSubtasks) * 100) : 0;

        return {
          totalGoals,
          totalTasks,
          completedTasks,
          totalSubtasks,
          completedSubtasks,
          completionPercentage,
          currentStreak: appData.streak.current_streak || 0,
          longestStreak: appData.streak.longest_streak || 0
        };
      };

      return (
        <GoalContext.Provider value={{
          goals: appData.goals || [],
          streak: appData.streak || { current_streak: 0, longest_streak: 0 },
          calendarHistory: appData.calendarHistory || {},
          profile: appData.profile || { name: 'Scholar Student' },
          settings: appData.settings || {},
          feedbackBanner,
          errorBanner,
          addGoal,
          deleteGoal,
          addTask,
          deleteTask,
          addSubtask,
          toggleSubtask,
          deleteSubtask,
          triggerDailyCheckIn,
          updateUserProfile,
          completeOnboarding,
          exportBackupData,
          importBackupData,
          resetAllData,
          getStats
        }}>
          {children}
        </GoalContext.Provider>
      );
    };

    window.useGoals = function() {
      return useContext(GoalContext);
    };

    // --- 3. First Launch Onboarding Modal ---
    window.WelcomeModal = function() {
      const { settings, completeOnboarding } = window.useGoals();
      if (settings.onboardingCompleted) return null;

      return (
        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0, 0, 0, 0.8)', backdropFilter: 'blur(10px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '20px' }}>
          <div className="glass-card" style={{ maxWidth: '550px', width: '100%', padding: '36px', textAlign: 'center' }}>
            <div style={{ fontSize: '3rem', marginBottom: 12 }}>🛡️</div>
            <h2 style={{ fontSize: '1.8rem', marginBottom: 12 }}>Welcome to Locin</h2>
            <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem', lineHeight: 1.6, marginBottom: 24 }}>
              Locin is a <strong>100% Privacy-First, Local-First</strong> productivity app. Your goals, tasks, fire streaks, and statistics are stored exclusively on your device.
            </p>

            <div style={{ textAlign: 'left', background: 'rgba(255, 255, 255, 0.03)', padding: 20, borderRadius: 'var(--radius-sm)', marginBottom: 24, display: 'flex', flexDirection: 'column', gap: 10, fontSize: '0.85rem' }}>
              <div>⚡ <strong>No Signup or Password Required</strong></div>
              <div>💾 <strong>Auto-Saved to Browser Storage</strong></div>
              <div>📥 <strong>Backup & Restore via JSON files anytime</strong></div>
            </div>

            <button className="btn btn-primary" style={{ width: '100%', padding: '14px' }} onClick={completeOnboarding}>
              Get Started (Local Mode) 🚀
            </button>
          </div>
        </div>
      );
    };

    // --- 4. Reusable UI Components ---
    window.Header = function({ onNavigateAuth }) {
      return (
        <header className="landing-header">
          <a href="#" className="logo-container">
            <div className="logo-icon"><i data-lucide="zap" style={{ color: '#fff' }}></i></div>
            <span>locin</span>
          </a>
          <nav className="nav-links">
            <a href="#features" className="nav-link">Features</a>
            <a href="#privacy" className="nav-link">Privacy</a>
            <a href="#compounding" className="nav-link">Why It Works</a>
            <button className="btn btn-primary btn-sm" onClick={() => onNavigateAuth('dashboard')}>Launch App 🚀</button>
          </nav>
        </header>
      );
    };

    window.Modal = function({ isOpen, onClose, title, children }) {
      if (!isOpen) return null;
      return (
        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0, 0, 0, 0.75)', backdropFilter: 'blur(8px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '20px' }}>
          <div className="glass-card" style={{ maxWidth: '500px', width: '100%', padding: '28px', position: 'relative' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '20px', borderBottom: '1px solid var(--border-color)', paddingBottom: '12px' }}>
              <h3 style={{ fontSize: '1.25rem' }}>{title}</h3>
              <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', fontSize: '1.2rem' }}>✕</button>
            </div>
            <div>{children}</div>
          </div>
        </div>
      );
    };

    window.HeroSection = function({ onNavigateAuth }) {
      return (
        <section className="hero-section">
          <div className="hero-pill">
            <span className="badge badge-primary"><i data-lucide="shield-check" style={{ width: 14, height: 14 }}></i> 100% Privacy-First • No Account Needed</span>
          </div>
          <h1 className="hero-title">Small actions. <br /><span className="gradient-text">Massive results.</span></h1>
          <p className="hero-subtitle">Transform your ambitions into daily compounding victories. Set goals, check in, and grow your 🔥 fire streak 100% privately on your device.</p>
          <div className="hero-cta-group">
            <button className="btn btn-primary" onClick={() => onNavigateAuth('dashboard')}><span>Launch Application</span><i data-lucide="arrow-right" style={{ width: 18, height: 18 }}></i></button>
          </div>
          <div className="hero-visual">
            <div className="glass-card floating-card animate-float" style={{ animationDelay: '0s' }}>
              <div className="floating-card-icon">🧠</div>
              <div><div style={{ fontWeight: 700, fontSize: '0.95rem' }}>Learn AI & ML</div><div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Python Basics • Variables</div><div className="badge badge-success" style={{ marginTop: 6 }}>92% Completed</div></div>
            </div>
            <div className="glass-card floating-card animate-float" style={{ animationDelay: '1.5s', borderColor: 'rgba(245, 158, 11, 0.4)' }}>
              <div className="floating-card-icon">🔥</div>
              <div><div style={{ fontWeight: 700, fontSize: '0.95rem' }}>Active Streak</div><div style={{ fontSize: '1.2rem', fontWeight: 800 }} className="gradient-flame">7 Days Unstoppable</div><div style={{ fontSize: '0.75rem', color: 'var(--text-subtle)' }}>Duolingo-inspired Momentum</div></div>
            </div>
            <div className="glass-card floating-card animate-float" style={{ animationDelay: '3s' }}>
              <div className="floating-card-icon">📅</div>
              <div><div style={{ fontWeight: 700, fontSize: '0.95rem' }}>Calendar Progress</div><div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>28 Days Checked In</div><div className="badge badge-primary" style={{ marginTop: 6 }}>Perfect Monthly Consistency</div></div>
            </div>
          </div>
        </section>
      );
    };

    window.FeaturesSection = function() {
      const features = [
        { icon: 'shield', title: '100% Privacy First', desc: 'No accounts, no cloud databases. Your data never leaves your device.' },
        { icon: 'target', title: '3-Tier Goal Management', desc: 'Organize Goals into Tasks, and break Tasks into Subtasks.' },
        { icon: 'check-circle-2', title: 'Daily Check-ins', desc: 'Satisfying check-ins with celebratory confetti bursts.' },
        { icon: 'flame', title: 'Duolingo Fire Streak', desc: 'Build unstoppable momentum with visual 🔥 streak tracking.' },
        { icon: 'calendar', title: 'Calendar Heatmap', desc: 'Visualize your monthly activity with crisp color indicators.' },
        { icon: 'download', title: 'JSON Backup & Restore', desc: 'Export all data to a JSON file and restore anytime.' },
        { icon: 'layout-dashboard', title: 'Personalized Dashboard', desc: 'A clean glassmorphic command center tailored for maximum focus.' }
      ];
      return (
        <section id="features" className="section-container">
          <div className="section-header">
            <span className="badge badge-primary" style={{ marginBottom: 12 }}>Local & Private</span>
            <h2 className="section-title">Everything you need to master your goals</h2>
            <p className="section-description">Built with precision to help student developers maintain consistency offline.</p>
          </div>
          <div className="features-grid">
            {features.map((f, i) => (
              <div key={i} className="glass-card feature-card">
                <div className="feature-icon-wrapper"><i data-lucide={f.icon} style={{ width: 28, height: 28 }}></i></div>
                <h3>{f.title}</h3>
                <p>{f.desc}</p>
              </div>
            ))}
          </div>
        </section>
      );
    };

    window.MotivationSection = function() {
      const quotes = [
        { quote: "I fear not the man who has practiced 10,000 kicks once, but I fear the man who has practiced one kick 10,000 times.", author: "Bruce Lee", role: "Martial Artist & Philosopher" },
        { quote: "You do not rise to the level of your goals. You fall to the level of your systems.", author: "James Clear", role: "Author of Atomic Habits" },
        { quote: "Discipline is doing what you hate to do, but doing it like you love it.", author: "Mike Tyson", role: "Heavyweight Champion" },
        { quote: "I hated every minute of training, but I said, 'Don't quit. Suffer now and live as a champion.'", author: "Muhammad Ali", role: "Global Icon & Champion" },
        { quote: "The only way to do great work is to love what you do.", author: "Steve Jobs", role: "Co-Founder of Apple" },
        { quote: "The resistance that you fight physically and in life builds a strong character.", author: "Arnold Schwarzenegger", role: "Bodybuilder & Entrepreneur" }
      ];
      return (
        <section id="motivation" className="section-container" style={{ background: 'rgba(255, 255, 255, 0.01)' }}>
          <div className="section-header">
            <span className="badge badge-flame" style={{ marginBottom: 12 }}>Mindset matters</span>
            <h2 className="section-title">Words from the World's Best</h2>
            <p className="section-description">Consistency is the bridge between goals and accomplishment.</p>
          </div>
          <div className="quotes-grid">
            {quotes.map((q, i) => (
              <div key={i} className="glass-card quote-card">
                <div className="quote-icon">“</div>
                <p className="quote-text">{q.quote}</p>
                <div>
                  <div className="quote-author">{q.author}</div>
                  <div className="quote-role">{q.role}</div>
                </div>
              </div>
            ))}
          </div>
        </section>
      );
    };

    window.CompoundingSection = function() {
      const [dailyPct, setDailyPct] = useState(1);
      const growthFactor = Math.pow(1 + dailyPct / 100, 365).toFixed(1);
      const declineFactor = Math.pow(1 - dailyPct / 100, 365).toFixed(2);

      return (
        <section id="compounding" className="section-container">
          <div className="section-header">
            <span className="badge badge-success" style={{ marginBottom: 12 }}>The Math of Success</span>
            <h2 className="section-title">Why Small Habits Compound</h2>
            <p className="section-description">Improving just {dailyPct}% every day yields exponential results by year end.</p>
          </div>
          <div className="compounding-wrapper">
            <div className="glass-card compounding-card">
              <h3>Interactive Compounding Calculator</h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem' }}>Adjust your daily effort percentage:</p>
              <div>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8, fontWeight: 600 }}>
                  <span>Daily Effort Increase:</span>
                  <span className="gradient-text">{dailyPct}% per day</span>
                </div>
                <input type="range" min="0.1" max="3" step="0.1" value={dailyPct} onChange={(e) => setDailyPct(parseFloat(e.target.value))} style={{ width: '100%', accentColor: 'var(--primary)', height: 6, cursor: 'pointer' }} />
              </div>
              <div className="stat-box-group">
                <div className="stat-box" style={{ borderColor: 'rgba(16, 185, 129, 0.4)' }}>
                  <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginBottom: 4 }}>1.0{dailyPct}³⁶⁵ (1% Better Every Day)</div>
                  <div className="stat-val" style={{ color: '#6ee7b7' }}>{growthFactor}x</div>
                  <div style={{ fontSize: '0.75rem', color: '#10b981', marginTop: 4 }}>Exponential Success</div>
                </div>
                <div className="stat-box" style={{ borderColor: 'rgba(239, 68, 68, 0.3)' }}>
                  <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginBottom: 4 }}>0.99³⁶⁵ (1% Worse Every Day)</div>
                  <div className="stat-val" style={{ color: '#fca5a5' }}>{declineFactor}x</div>
                  <div style={{ fontSize: '0.75rem', color: '#ef4444', marginTop: 4 }}>Stagnation</div>
                </div>
              </div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
              <div className="glass-card" style={{ padding: 28 }}>
                <h4 style={{ fontSize: '1.1rem', marginBottom: 8, color: 'var(--primary)' }}>🎯 1. Systems Over Intensity</h4>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Locin structures your goals into small daily subtasks that take minutes to check off, creating sustainable momentum.</p>
              </div>
              <div className="glass-card" style={{ padding: 28 }}>
                <h4 style={{ fontSize: '1.1rem', marginBottom: 8, color: 'var(--accent-flame)' }}>🔥 2. The Power of Streaks</h4>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Visual streak counters trigger dopamine loops. Once you build a streak, you won't want to break the chain.</p>
              </div>
              <div className="glass-card" style={{ padding: 28 }}>
                <h4 style={{ fontSize: '1.1rem', marginBottom: 8, color: 'var(--secondary)' }}>📈 3. Clear Visual Feedback</h4>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>Calendar heatmaps and statistics charts give you immediate proof of your progress every week.</p>
              </div>
            </div>
          </div>
        </section>
      );
    };

    window.FinalCtaSection = function({ onNavigateAuth }) {
      return (
        <section className="final-cta">
          <div className="glass-card final-cta-card">
            <span className="badge badge-primary">No Signup Required</span>
            <h2 style={{ fontSize: '2.5rem', lineHeight: 1.2 }}>Start Building <span className="gradient-text">Better Habits Today</span></h2>
            <p style={{ color: 'var(--text-muted)', maxWidth: 550 }}>Use Locin to track daily goals, build fire streaks, and compound success 100% privately on your device.</p>
            <button className="btn btn-primary" style={{ padding: '14px 32px', fontSize: '1.05rem' }} onClick={() => onNavigateAuth('dashboard')}>
              <span>Launch App (Local Mode)</span>
              <i data-lucide="arrow-right" style={{ width: 20, height: 20 }}></i>
            </button>
          </div>
        </section>
      );
    };

    // --- 5. Sidebar ---
    window.Sidebar = function({ activeTab, setActiveTab }) {
      const { setAuthView } = window.useAuth();
      const navItems = [
        { id: 'home', label: 'Dashboard', icon: 'layout-dashboard' },
        { id: 'goals', label: 'Goals', icon: 'target' },

    window.CalendarView = function() {
      const { streak, calendarHistory } = window.useGoals();
      const [currentDate, setCurrentDate] = useState(new Date());

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = new Date();

      const cells = [];
      for (let i = 0; i < firstDay; i++) cells.push({ empty: true });
      for (let day = 1; day <= daysInMonth; day++) {
        const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isCompleted = !!calendarHistory[dStr];
        const isToday = (day === today.getDate() && month === today.getMonth() && year === today.getFullYear());
        const isPastMissed = !isCompleted && !isToday && new Date(dStr) < today;
        cells.push({ day, dateStr: dStr, isCompleted, isToday, isPastMissed });
      }

      return (
        <div>
          <div className="top-bar">
            <div>
              <h1 style={{ fontSize: '1.8rem' }}>Calendar Progress Heatmap</h1>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem' }}>Visual monthly activity log saved locally on your device.</p>
            </div>
            <div className="badge badge-flame" style={{ padding: '8px 16px', fontSize: '0.85rem' }}>🔥 {streak.current_streak || 0} Days Active Streak</div>
          </div>
          <div className="glass-card" style={{ padding: 32 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                <h2 style={{ fontSize: '1.4rem' }}>{monthNames[month]} {year}</h2>
                <div style={{ display: 'flex', gap: 6 }}>
                  <button className="btn btn-secondary btn-sm" onClick={() => setCurrentDate(new Date(year, month - 1, 1))}>← Prev</button>
                  <button className="btn btn-secondary btn-sm" onClick={() => setCurrentDate(new Date(year, month + 1, 1))}>Next →</button>
                </div>
              </div>
              <div style={{ display: 'flex', gap: 16, fontSize: '0.85rem', color: 'var(--text-muted)' }}>
                <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 12, height: 12, borderRadius: 3, background: 'rgba(245, 158, 11, 0.6)' }}></span> Checked In</span>
                <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 12, height: 12, borderRadius: 3, background: 'rgba(239, 68, 68, 0.25)', border: '1px solid rgba(239, 68, 68, 0.4)' }}></span> Missed</span>
                <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span style={{ width: 12, height: 12, borderRadius: 3, border: '2px solid var(--primary)' }}></span> Today</span>
              </div>
            </div>

            <div className="calendar-grid">
              {daysOfWeek.map((d, i) => <div key={i} className="calendar-day-header">{d}</div>)}
              {cells.map((cell, idx) => {
                if (cell.empty) return <div key={idx} className="calendar-day-cell empty"></div>;
                return (
                  <div key={idx} className={`calendar-day-cell ${cell.isCompleted ? 'flame' : ''}`} style={{ border: cell.isToday ? '2px solid var(--primary)' : undefined, background: cell.isPastMissed ? 'rgba(239, 68, 68, 0.08)' : undefined, borderColor: cell.isPastMissed ? 'rgba(239, 68, 68, 0.2)' : undefined }}>
                    <span>{cell.day}</span>
                    {cell.isCompleted && <span style={{ fontSize: '0.75rem', marginTop: 2 }}>🔥</span>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

              <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>Fire Streak Record</p>
              <h2 style={{ fontSize: '2.4rem', margin: '8px 0' }} className="gradient-flame">🔥 {streak.longest_streak || 0} Days</h2>
              <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Current Active: {streak.current_streak || 0} Days</p>
            </div>
          </div>
          <div className="glass-card" style={{ padding: 32 }}>
            <h3 style={{ fontSize: '1.2rem', marginBottom: 8 }}>Weekly Activity Trend</h3>
            <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem', marginBottom: 20 }}>Relative subtask activity distribution:</p>
            <div className="bar-chart-container">
              {weeklyData.map((item, idx) => (
                <div key={idx} className="chart-bar-group">
                  <span style={{ fontSize: '0.75rem', color: 'var(--text-subtle)' }}>{item.count}</span>
                  <div className="chart-bar-track"><div className="chart-bar-fill" style={{ height: `${item.heightPct}%` }}></div></div>
                  <span style={{ fontSize: '0.8rem', fontWeight: 600, color: 'var(--text-muted)' }}>{item.day}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    window.ProfileView = function() {
      const { profile, streak, getStats, updateUserProfile, feedbackBanner } = window.useGoals();
      const stats = getStats();
      const initialName = profile?.name || 'Scholar Student';
      const [nameInput, setNameInput] = useState(initialName);
      const [isEditing, setIsEditing] = useState(false);

      const handleUpdateName = (e) => {
        e.preventDefault();
        if (!nameInput.trim()) return;
        updateUserProfile(nameInput.trim());
        setIsEditing(false);
      };

      const badges = [
        { title: 'Habit Starter', desc: 'Completed 1st daily check-in', icon: '⚡', unlocked: (streak.current_streak > 0 || streak.longest_streak > 0) },
        { title: '7-Day Streak Warrior', desc: 'Reached a 7-day fire streak', icon: '🔥', unlocked: streak.current_streak >= 7 || streak.longest_streak >= 7 },
        { title: 'Goal Crusher', desc: 'Created goals in storage', icon: '🎯', unlocked: stats.totalGoals > 0 },
        { title: 'Local Scholar', desc: 'Privacy-First device mode', icon: '🛡️', unlocked: true }
      ];

      return (
        <div>
          <div className="top-bar">
            <div>
              <h1 style={{ fontSize: '1.8rem' }}>Profile & Achievements</h1>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem' }}>Personal profile saved on your device.</p>
            </div>
          </div>

          {feedbackBanner && <div className="badge badge-success" style={{ padding: '10px 16px', borderRadius: 8, marginBottom: 20, fontSize: '0.9rem', width: '100%', display: 'flex', justifyContent: 'center' }}>{feedbackBanner}</div>}

          <div style={{ display: 'grid', gridTemplateColumns: '340px 1fr', gap: 28 }}>
            <div className="glass-card" style={{ padding: 32, textAlign: 'center' }}>
              <div className="avatar" style={{ width: 80, height: 80, fontSize: '2rem', margin: '0 auto 16px' }}>{initialName.charAt(0).toUpperCase()}</div>

              {!isEditing ? (
                <div>
                  <h2 style={{ fontSize: '1.4rem', marginBottom: 4 }}>{initialName}</h2>
                  <button className="btn btn-secondary btn-sm" onClick={() => { setNameInput(initialName); setIsEditing(true); }} style={{ margin: '8px 0 16px' }}>✏️ Edit Name</button>
                </div>
              ) : (
                <form onSubmit={handleUpdateName} style={{ marginBottom: 16 }}>
                  <input type="text" className="form-input" value={nameInput} onChange={(e) => setNameInput(e.target.value)} style={{ textAlign: 'center', marginBottom: 8 }} required />
                  <div style={{ display: 'flex', gap: 8, justifyContent: 'center' }}>
                    <button type="submit" className="btn btn-primary btn-sm">Save</button>
                    <button type="button" className="btn btn-secondary btn-sm" onClick={() => setIsEditing(false)}>Cancel</button>
                  </div>
                </form>
              )}

              <p style={{ color: '#6ee7b7', fontSize: '0.85rem', marginBottom: 20 }}>🛡️ Privacy Mode (Device Only)</p>
              <div style={{ borderTop: '1px solid var(--border-color)', paddingTop: 16, textAlign: 'left', display: 'flex', flexDirection: 'column', gap: 10, fontSize: '0.85rem' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}><span style={{ color: 'var(--text-muted)' }}>🔥 Current Streak:</span><span style={{ fontWeight: 700 }}>{streak.current_streak || 0} Days</span></div>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}><span style={{ color: 'var(--text-muted)' }}>⚡ Longest Streak:</span><span style={{ fontWeight: 700 }}>{streak.longest_streak || 0} Days</span></div>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}><span style={{ color: 'var(--text-muted)' }}>🎯 Total Goals:</span><span style={{ fontWeight: 700 }}>{stats.totalGoals}</span></div>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}><span style={{ color: 'var(--text-muted)' }}>📌 Tasks Completed:</span><span style={{ fontWeight: 700 }}>{stats.completedTasks} / {stats.totalTasks}</span></div>
              </div>
            </div>

            <div className="glass-card" style={{ padding: 32 }}>
              <h3 style={{ fontSize: '1.25rem', marginBottom: 20 }}>Achievement Badges</h3>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 16 }}>
                {badges.map((b, i) => (
                  <div key={i} style={{ padding: 20, borderRadius: 'var(--radius-sm)', background: b.unlocked ? 'rgba(99, 102, 241, 0.1)' : 'rgba(255, 255, 255, 0.02)', border: '1px solid', borderColor: b.unlocked ? 'rgba(99, 102, 241, 0.3)' : 'var(--border-color)', opacity: b.unlocked ? 1 : 0.5 }}>
                    <div style={{ fontSize: '2rem', marginBottom: 8 }}>{b.icon}</div>
                    <div style={{ fontWeight: 700, fontSize: '0.95rem' }}>{b.title}</div>
                    <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: 4 }}>{b.desc}</div>
                    {b.unlocked ? <span className="badge badge-success" style={{ marginTop: 10 }}>Unlocked</span> : <span className="badge" style={{ marginTop: 10, background: 'rgba(255, 255, 255, 0.05)', color: 'var(--text-subtle)' }}>Locked</span>}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- 7. Settings, Backup & Restore View ---
    window.SettingsView = function() {
      const { exportBackupData, importBackupData, resetAllData, feedbackBanner, errorBanner } = window.useGoals();
      const [showResetConfirm, setShowResetConfirm] = useState(false);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          importBackupData(event.target.result);
        };
        reader.readAsText(file);
      };

      return (
        <div>
          <div className="top-bar">
            <div>
              <h1 style={{ fontSize: '1.8rem' }}>Settings & Backup</h1>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem' }}>Export/Import your JSON backup data, view privacy notices, and explore the roadmap.</p>
            </div>
          </div>

          {errorBanner && <div className="btn-danger" style={{ padding: 12, borderRadius: 8, marginBottom: 20, fontSize: '0.85rem' }}>⚠️ {errorBanner}</div>}
          {feedbackBanner && <div className="badge badge-success" style={{ padding: '10px 16px', borderRadius: 8, marginBottom: 20, fontSize: '0.9rem', width: '100%', display: 'flex', justifyContent: 'center' }}>{feedbackBanner}</div>}

          {/* Section 1: Backup & Restore */}
          <div className="glass-card" style={{ padding: 32, marginBottom: 28 }}>
            <h2 style={{ fontSize: '1.4rem', marginBottom: 12 }}>📥 Backup & Restore</h2>
            <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem', marginBottom: 24 }}>
              Your data is saved automatically to your device's browser storage. Export a JSON backup file anytime to transfer data between devices or keep offline backups.
            </p>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: 20 }}>
              <div style={{ background: 'rgba(255, 255, 255, 0.03)', padding: 24, borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-color)' }}>
                <h3 style={{ fontSize: '1.1rem', marginBottom: 8 }}>Export JSON Backup</h3>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem', marginBottom: 16 }}>Download complete copy of your goals, tasks, streaks, and calendar history.</p>
                <button className="btn btn-primary btn-sm" onClick={exportBackupData}>
                  📥 Download Backup JSON
                </button>
              </div>

              <div style={{ background: 'rgba(255, 255, 255, 0.03)', padding: 24, borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-color)' }}>
                <h3 style={{ fontSize: '1.1rem', marginBottom: 8 }}>Import JSON Backup</h3>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem', marginBottom: 16 }}>Restore your data from a previously exported `.json` file.</p>
                <input type="file" accept=".json" onChange={handleFileUpload} style={{ display: 'none' }} id="jsonFileInput" />
                <label htmlFor="jsonFileInput" className="btn btn-secondary btn-sm" style={{ cursor: 'pointer', display: 'inline-flex' }}>
                  📤 Select JSON File to Restore
                </label>
              </div>

              <div style={{ background: 'rgba(239, 68, 68, 0.05)', padding: 24, borderRadius: 'var(--radius-sm)', border: '1px solid rgba(239, 68, 68, 0.2)' }}>
                <h3 style={{ fontSize: '1.1rem', marginBottom: 8, color: '#fca5a5' }}>Reset All Local Data</h3>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem', marginBottom: 16 }}>Permanently erase locally stored data and reset the app to first launch state.</p>
                <button className="btn btn-danger btn-sm" onClick={() => setShowResetConfirm(true)}>
                  🗑️ Reset All Data
                </button>
              </div>
            </div>
          </div>

          {/* Section 2: Privacy First Philosophy */}
          <div id="privacy" className="glass-card" style={{ padding: 32, marginBottom: 28, borderColor: 'rgba(16, 185, 129, 0.4)' }}>
            <h2 style={{ fontSize: '1.4rem', marginBottom: 12, color: '#6ee7b7' }}>🛡️ Privacy First Philosophy</h2>
            <blockquote style={{ fontSize: '1.05rem', lineHeight: 1.6, color: 'var(--text-main)', fontStyle: 'italic', borderLeft: '3px solid #10b981', paddingLeft: 16, margin: '16px 0' }}>
              "Your productivity data stays entirely on your device. LOCIN does not require an account and does not upload your information to any server. Your goals, tasks, streaks, and statistics remain private. Future versions may offer optional cloud sync for users who want access across multiple devices."
            </blockquote>
          </div>

          {/* Section 3: Future Roadmap */}
          <div className="glass-card" style={{ padding: 32 }}>
            <h2 style={{ fontSize: '1.4rem', marginBottom: 16 }}>🗺️ Project Roadmap</h2>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
              <div style={{ background: 'rgba(99, 102, 241, 0.1)', padding: 20, borderRadius: 'var(--radius-sm)', border: '1px solid rgba(99, 102, 241, 0.3)' }}>
                <h3 style={{ fontSize: '1.1rem', marginBottom: 12, color: '#a5b4fc' }}>Version 1.0 (Current)</h3>
                <ul style={{ listStyleType: 'none', padding: 0, display: 'flex', flexDirection: 'column', gap: 8, fontSize: '0.9rem' }}>
                  <li>✅ Local-first offline storage</li>
                  <li>✅ No account or signup required</li>
                  <li>✅ Fast instant performance</li>
                  <li>✅ Privacy-first device design</li>
                  <li>✅ Works 100% offline</li>
                  <li>✅ JSON Backup & Restore</li>
                </ul>
              </div>

              <div style={{ background: 'rgba(255, 255, 255, 0.02)', padding: 20, borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-color)' }}>
                <h3 style={{ fontSize: '1.1rem', marginBottom: 12, color: 'var(--text-muted)' }}>Planned Future Versions</h3>
                <ul style={{ listStyleType: 'none', padding: 0, display: 'flex', flexDirection: 'column', gap: 8, fontSize: '0.9rem', color: 'var(--text-muted)' }}>
                  <li>🔹 Optional Cloud Synchronization</li>
                  <li>🔹 Google & Email OAuth Login</li>
                  <li>🔹 Cross-device automatic sync</li>
                  <li>🔹 Encrypted Cloud Backups</li>
                  <li>🔹 Shared Goals & Collaboration</li>
                  <li>🔹 Web Push Reminders</li>
                </ul>
              </div>
            </div>
          </div>

          {/* Reset Confirmation Modal */}
          <window.Modal isOpen={showResetConfirm} onClose={() => setShowResetConfirm(false)} title="Confirm Reset All Local Data">
            <p style={{ color: 'var(--text-muted)', marginBottom: 20 }}>
              Are you sure? This will <strong>permanently delete all locally stored goals, tasks, fire streaks, and calendar history</strong> on this browser.
            </p>
            <div style={{ display: 'flex', gap: 12, justifyContent: 'flex-end' }}>
              <button className="btn btn-secondary btn-sm" onClick={() => setShowResetConfirm(false)}>Cancel</button>
              <button className="btn btn-danger btn-sm" onClick={() => { resetAllData(); setShowResetConfirm(false); }}>
                Yes, Reset All Data
              </button>
            </div>
          </window.Modal>
        </div>
      );
    };

    // --- 8. Main App Layout & View Router ---
    function AppContent() {
      const { authView, setAuthView } = window.useAuth();
      const [activeTab, setActiveTab] = useState('home');

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [authView, activeTab]);

      if (authView === 'landing') {
        return (
          <div className="app-container">
            <window.Header onNavigateAuth={(mode) => setAuthView(mode)} />
            <window.HeroSection onNavigateAuth={(mode) => setAuthView(mode)} />
            <window.FeaturesSection />
            <window.MotivationSection />
            <window.CompoundingSection />
            <window.FinalCtaSection onNavigateAuth={(mode) => setAuthView(mode)} />
          </div>
        );
      }

      return (
        <div className="dashboard-layout">
          <window.Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />
          <window.WelcomeModal />
          <main className="dashboard-main">
            {activeTab === 'home' && <window.DashboardHome setActiveTab={setActiveTab} />}
            {activeTab === 'goals' && <window.GoalManager />}
            {activeTab === 'checkin' && <window.DailyCheckIn />}
            {activeTab === 'calendar' && <window.CalendarView />}
            {activeTab === 'stats' && <window.StatsView />}
            {activeTab === 'profile' && <window.ProfileView />}
            {activeTab === 'settings' && <window.SettingsView />}
          </main>
        </div>
      );
    }

    function App() {
      return (
        <window.AuthProvider>
          <window.GoalProvider>
            <AppContent />
          </window.GoalProvider>
        </window.AuthProvider>
      );
    }

    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    }
  </script>
</body>
</html>
